                  removeData: false
        required: true
      responses:
        200:
          description: Validation Task result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
              examples: 
                validDescriptor:
                  value:
                    valid: true
                invalidDescriptor:
                  value:
                    valid: false
                    error:
                      errors:
                        - specific.region is required
        500:
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
              examples: 
