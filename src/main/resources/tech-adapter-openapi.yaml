      requestBody:
        description: Details of a provisioning request to be validated
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisioningRequest'
            examples:
              'System Descriptor':
                value:
                  descriptorKind: DATAPRODUCT_DESCRIPTOR
