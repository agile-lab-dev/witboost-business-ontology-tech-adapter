\"\"\n      confidentiality: \"\"\n    tags: []\n    sampleData:\n      columns:\n        - id\n        - direction\n        - amount\n        - counterpartyId\n      rows:\n        - - CF-001\n          - Incoming\n          - 10000\n          - cpty:12345\n        - - CF-002\n          - Outgoing\n          - 5000\n          - cpty:67890\n    semanticLinking: []\n    specific:\n      format: Iceberg\n    consumable: true\n    shoppable: true\n  - kind: workload\n    id: urn:dmb:cmp:finance:cashflow:0:cashflow-calculation\n    description: Workload that calculates cashflows from input deals\n    useCaseTemplateId: urn:dmb:utm:workload-template:0.0.0\n    infrastructureTemplateId: urn:dmb:itm:workload-provisioner:1\n    fullyQualifiedName: CashFlow Calculation\n    name: CashFlow Calculation\n    technology: Spark\n    version: 0.0.0\n    dependsOn:\n      - urn:dmb:cmp:finance:cashflow:0:storage-component\n    readsFrom: []\n    tags: []\n    specific: {}\n    consumable: false\n    shoppable: false\n  - kind: storage\n    id: urn:dmb:cmp:finance:cashflow:0:storage-component\n    description: Internal storage for the data product\n    name: Storage Component\n    fullyQualifiedName: Internal Storage\n    version: 0.0.0\n    infrastructureTemplateId: urn:dmb:itm:storage-provisioner:0\n    useCaseTemplateId: urn:dmb:utm:storage-template:0.0.0\n    dependsOn: []\n    platform: AWS\n    technology: S3\n    storageType: Database\n    tags: []\n    specific:\n      bucket: finance-cashflows\n    consumable: false\n    shoppable: false"
                  removeData: false
              'Component Descriptor':
                value:
                  descriptorKind: COMPONENT_DESCRIPTOR
                  descriptor: "dataProduct:\n  dataProductOwnerDisplayName: John Smith\n  projectOwner: user:john.smith_example.com\n  projectOwnerDisplayName: John Smith\n  environment: production\n  domain: finance\n  projectKind: system\n  kind: dataproduct\n  domainId: urn:dmb:dmn:finance\n  id: urn:dmb:dp:finance:cashflow:0\n  description: Data product representing operating cashflows\n  devGroup: teamalpha\n  ownerGroup: john.smith_example.com\n  dataProductOwner: user:john.smith_example.com\n  version: 0.1.0\n  fullyQualifiedName: Cash Flows\n  name: CashFlow\n  informationSLA: daily\n  maturity: Approved\n  useCaseTemplateId: urn:dmb:utm:dataproduct-template:0.0.0\n  infrastructureTemplateId: urn:dmb:itm:dataproduct-provisioner:1\n  billing: {}\n  tags: []\n  specific: {}\n  components:\n    - kind: outputport\n      id: urn:dmb:cmp:finance:cashflow:0:cashflow-output-port\n      description: Output port exposing cashflow data\n      name: CashFlow OutputPort\n      fullyQualifiedName: null\n      version: 0.0.0\n      infrastructureTemplateId: urn:dmb:itm:output-port-provisioner:1\n      useCaseTemplateId: urn:dmb:utm:output-port-template:1.0.0\n      dependsOn: []\n      platform: AWS\n      technology: S3\n      outputPortType: SQL\n      creationDate: null\n      startDate: null\n      processDescription: null\n      dataContract:\n        schema:\n          - name: id\n            dataType: string\n            tags: []\n          - name: direction\n            dataType: string\n            tags: []\n          - name: amount\n            dataType: number\n            description: monetary value of the cashflow\n            tags: []\n          - name: counterpartyId\n            dataType: string\n            description: identifier of the counterparty\n            tags: []\n        termsAndConditions: \"\"\n        endpoint: null\n        SLA:\n          intervalOfChange: 2 day\n          timeliness: 2 day\n          upTime: 99.9%\n      dataSharingAgreement:\n        purpose: \"\"\n        billing: \"\"\n        security: \"\"\n        intendedUsage: \"\"\n        limitations: \"\"\n        lifeCycle: \"\"\n        confidentiality: \"\"\n      tags: []\n      sampleData:\n        columns:\n          - id\n          - direction\n          - amount\n          - counterpartyId\n        rows:\n          - - CF-001\n            - Incoming\n            - 10000\n            - cpty:12345\n          - - CF-002\n            - Outgoing\n            - 5000\n            - cpty:67890\n      semanticLinking: []\n      specific:\n        format: Iceberg\n      consumable: true\n      shoppable: true\n    - kind: workload\n      id: urn:dmb:cmp:finance:cashflow:0:cashflow-calculation\n      description: Workload that calculates cashflows from input deals\n      useCaseTemplateId: urn:dmb:utm:workload-template:0.0.0\n      infrastructureTemplateId: urn:dmb:itm:workload-provisioner:1\n      fullyQualifiedName: CashFlow Calculation\n      name: CashFlow Calculation\n      technology: Spark\n      version: 0.0.0\n      dependsOn:\n        - urn:dmb:cmp:finance:cashflow:0:storage-component\n      readsFrom: []\n      tags: []\n      specific: {}\n      consumable: false\n      shoppable: false\n    - kind: storage\n      id: urn:dmb:cmp:finance:cashflow:0:storage-component\n      description: Internal storage for the data product\n      name: Storage Component\n      fullyQualifiedName: Internal Storage\n      version: 0.0.0\n      infrastructureTemplateId: urn:dmb:itm:storage-provisioner:0\n      useCaseTemplateId: urn:dmb:utm:storage-template:0.0.0\n      dependsOn: []\n      platform: AWS\n      technology: S3\n      storageType: Database\n      tags: []\n      specific:\n        bucket: finance-cashflows\n      consumable: false\n      shoppable: false\ncomponentIdToProvision: urn:dmb:cmp:finance:cashflow:0:cashflow-output-port"
                  removeData: false
        required: true
      responses:
        202:
          description: It returns a token that can be used for polling the async validation operation status and results
          content:
            text/plain:
              schema:
                type: string
              examples: 
                success:
                  value: 3da5d0a2-9f3b-4a11-85a3-b5ddb73da032
        400:
          description: Invalid Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestValidationError'
              examples:
                missingDescriptor:
                  value:
                    errors:
                      - descriptor is required
                    userMessage: The descriptor field is required
                    moreInfo:
                      problems:
                        - The descriptor field is required
                    solutions:
                      - Please provide a valid descriptor
        500:
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
              examples:
                systemError:
                  value:
                    error: "Internal server error"
                    userMessage: "An internal server error occurred"
                    moreInfo:
                      problems: 
                        - "The server encountered an internal error"
                      solutions: 
                        - "Please try again later"
  /v2/validate/{token}/status:
    get:
      tags:
        - TechAdapter
      summary: Get status of an async validation task
      operationId: getValidationStatus
      parameters:
        - name: token
          in: path
          description: Token obtained after a call to the async validate endpoint
          required: true
          schema:
            type: string
            example: 3da5d0a2-9f3b-4a11-85a3-b5ddb73da032
      responses:
        200:
          description: Validation Task status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationStatus'
              examples:
                success:
                  value:
                    status: COMPLETED
                    info:
                      publicInfo:
                        valid: true
                failure:
                  value:
                    status: COMPLETED
                    info:
                      publicInfo:
                        valid: false
                        error:
                          errors:
                            - specific.region is required
        400:
          description: Invalid Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestValidationError'
              examples:
                badToken:
                  value:
                    errors:
                      - validation operation not found
                    userMessage: There is no validation process with the provided token
                    moreInfo:
                      problems:
                        - There is no validation process with the provided token
                      solutions:
                        - Please check if the token is correct
        500:
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
              examples:
                systemError:
                  value:
                    error: "Internal server error"
                    userMessage: "An internal server error occurred"
                    moreInfo:
                      problems: [ "The server encountered an internal error" ]
                      solutions: [ "Please try again later" ]
